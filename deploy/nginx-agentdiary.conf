# 80 端口只做两件事:放行 ACME 续期挑战,其余全部跳 HTTPS。
# 注意:裸 IP 访问(Host: 43.130.127.226)也会被跳到域名上——客户端必须
# 用域名,证书只对域名有效。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://43.130.127.226.sslip.io$request_uri;
    }
}

server {
    # nginx 1.24:http2 写在 listen 上;1.25+ 才是独立的 http2 on;
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 43.130.127.226.sslip.io;

    ssl_certificate     /etc/letsencrypt/live/43.130.127.226.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/43.130.127.226.sslip.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 头像上限 8MB 且走 base64(膨胀 1.33 倍),默认 1m 会直接 413
    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 蒸馏和对话都是长请求,默认 60s 会截断
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
